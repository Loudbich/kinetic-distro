name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '12 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test sync parsers
        run: npm test

      - name: Sync SoundCloud catalogue
        run: npm run sync
        continue-on-error: true

      - name: Commit catalogue changes
        run: |
          if [[ -n "$(git status --porcelain src/content/catalog.generated.json)" ]]; then
            git config user.name  "kinetic-sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/catalog.generated.json
            git commit -m "chore(sync): refresh SoundCloud catalogue"
            git push
          else
            echo "No catalogue change."
          fi

      - name: Build
        run: npm run build

      - name: Audit SEO output
        run: npm run audit

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
