<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090A" />

    <!-- Marks the document as JS-capable before first paint. Scroll-reveal
         animations are gated on this class, so crawlers and no-JS readers get
         the fully visible page. -->
    <script>document.documentElement.classList.add('js');</script>

    <!--seo-start-->
    <!-- Replaced at build time from the artwork manifest; this default only
         serves `npm run dev`, which does not run the prerenderer. -->
    <link rel="icon" type="image/png" href="/logo-seul.png" />
    <title>Kinetic Distro — Independent Label &amp; Creative Distribution</title>
    <meta
      name="description"
      content="Kinetic Distro is an independent music label and creative distribution platform dedicated to pushing the boundaries of sound, identity and artistic storytelling in the digital age."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.kinetic-distro.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kinetic Distro" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Kinetic Distro — Independent Label &amp; Creative Distribution" />
    <meta
      property="og:description"
      content="A roster of distinct sonic universes. Narrative-driven releases, artist-first distribution."
    />
    <meta property="og:url" content="https://www.kinetic-distro.com/" />
    <meta property="og:image" content="https://www.kinetic-distro.com/logo.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kinetic Distro — Independent Label &amp; Creative Distribution" />
    <meta
      name="twitter:description"
      content="A roster of distinct sonic universes. Narrative-driven releases, artist-first distribution."
    />
    <meta name="twitter:image" content="https://www.kinetic-distro.com/logo.webp" />
    <!--seo-end-->

  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
